[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drivedav"
version = "2.1.0"
description = "一个挂载网盘为 WebDAV 的轻量级工具，默认支持阿里云盘，可扩展其他网盘。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "洪" }
]

dependencies = [
    "wsgidav==4.3.3",
    "cheroot==11.1.2",
    "cryptography>=3.4.8",
    "platformdirs>=4.5.1",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "tomli>=2.3.0; python_version < '3.11'",
    "tomli_w>=1.2.0"
]

[project.scripts]
drivedav = "drivedav.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drivedav*"]
